<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Newspaper Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="newspaper-layout">

  <header class="title">
    <h1>Daily Tech News</h1>
  </header>

  <article class="feature-article">
    <h2>Main Story</h2>
    <p>AI is transforming industries at an unprecedented speed.</p>
  </article>

  <figure class="cover-image">
    <img src="https://via.placeholder.com/600x400" alt="cover">
  </figure>

  <article class="secondary-article">
    <h2>Secondary Story</h2>
    <p>Technology continues to evolve in surprising ways.</p>
  </article>

  <article class="small-article1">
    <h3>News 1</h3>
    <p>Short update about tech.</p>
  </article>

  <article class="small-article2">
    <h3>News 2</h3>
    <p>Another small update.</p>
  </article>

  <article class="small-article3">
    <h3>News 3</h3>
    <p>Final quick update.</p>
  </article>

</main>

</body>
</html>
