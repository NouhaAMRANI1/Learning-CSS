<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tribute Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main id="main">

  <h1 id="title">Albert Einstein Tribute</h1>

  <div id="img-div">

    <img 
      id="image"
      src="https://upload.wikimedia.org/wikipedia/commons/d/d3/Albert_Einstein_Head.jpg"
      alt="Albert Einstein"
    >

    <div id="img-caption">
      Albert Einstein, one of the greatest physicists in history.
    </div>

  </div>

  <div id="tribute-info">
    Albert Einstein developed the theory of relativity and changed modern physics forever.
  </div>

  <a 
    id="tribute-link"
    href="https://en.wikipedia.org/wiki/Albert_Einstein"
    target="_blank"
  >
    Learn more about Einstein
  </a>

</main>

</body>
</html>
